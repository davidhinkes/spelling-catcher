<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --muted: #888; --line: rgba(128,128,128,.25); }
  body { font: 13px system-ui, sans-serif; margin: 0; width: 380px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 14px; margin: 0; }
  .tabs { display: flex; gap: 4px; padding: 8px 12px 0; }
  .tabs button { border: 0; background: none; padding: 6px 8px; cursor: pointer; border-bottom: 2px solid transparent; color: inherit; font: inherit; }
  .tabs button.on { border-color: currentColor; font-weight: 600; }
  .list { max-height: 340px; overflow: auto; padding: 4px 12px; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 5px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .wrong { text-decoration: underline wavy #d33; text-underline-offset: 3px; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  .x { border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; padding: 0; }
  .x:hover { color: inherit; text-decoration: underline; }
  footer { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--line); }
  footer button { font: inherit; padding: 4px 8px; cursor: pointer; }
  label { display: flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
  <header>
    <h1>Spelling Catcher</h1>
    <label><input type="checkbox" id="paused"> Paused</label>
  </header>
  <div class="tabs">
    <button id="tab-corrections" class="on">Corrected <span id="n-corrections" class="muted"></span></button>
    <button id="tab-flagged">Flagged, not fixed <span id="n-flagged" class="muted"></span></button>
  </div>
  <div class="list" id="list"></div>
  <footer>
    <button id="site">Ignore this site</button>
    <button id="md">Copy as Markdown</button>
    <button id="json">Export JSON</button>
    <button id="clear">Clear…</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
